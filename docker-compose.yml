services:
  muxcore:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MUXCORE_ADDR: ":8080"
    restart: unless-stopped
    healthcheck:
      # NOTE: requires curl in the image (added via Dockerfile fix)
      test: ["CMD-SHELL", "curl -sf https://127.0.0.1:8080/health || curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    volumes:
      - muxcore_data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
volumes:
  muxcore_data:
