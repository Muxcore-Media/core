# MuxCore golangci-lint configuration
# Run: golangci-lint run ./internal/... ./pkg/... ./cmd/...

version: "2"

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - prealloc
    - gosec
    - bodyclose
    - noctx
    - errorlint
    - forcetypeassert
  default: none
  settings:
    gosec:
      excludes:
        - G104

formatters:
  enable:
    - gofmt

run:
  timeout: 2m

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # gosec: test files use controlled paths (t.TempDir, etc).
    - path: '.*_test\.go'
      linters:
        - gosec
    
    # noctx: exec.Command should use CommandContext — nolint already present.
    - linters:
        - noctx
      source: '//nolint'
