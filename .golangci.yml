# MuxCore golangci-lint configuration
# Run: golangci-lint run ./internal/... ./pkg/... ./cmd/...
version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - unconvert
    - prealloc
    - gosec        # security-focused static analysis
    - bodyclose    # check HTTP response bodies are closed
    - noctx        # detect HTTP requests without context
  disable-all: false

run:
  timeout: 2m
  go: "1.26"

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
