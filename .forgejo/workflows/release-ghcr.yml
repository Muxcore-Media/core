# Publish muxcored to GHCR on version tags.
# Host build (Forgejo module fetch) + Dockerfile.goreleaser; optional push via GHCR_TOKEN secret.
name: Release GHCR
on:
  push:
    tags:
      - "v*"

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GOPROXY: https://proxy.golang.org,direct

jobs:
  publish:
    runs-on: native
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build muxcored binary and OCI image
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ]; then
            curl -fsSL "https://go.dev/dl/go1.26.5.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          export PATH="$HOME/.local/go/bin:$PATH"
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
          CGO_ENABLED=0 go build \
            -ldflags="-s -w -X github.com/Muxcore-Media/core/internal/version.Version=${ver}" \
            -o muxcored ./cmd/muxcored
          PODMAN="${PODMAN:-/home/ender/.nix-profile/bin/podman}"
          if ! "$PODMAN" version >/dev/null 2>&1; then
            echo "podman unavailable for gitea-runner — use core/scripts/publish-muxcored-vault-ghcr.sh on vault"
            exit 1
          fi
          "$PODMAN" build -t "localhost/muxcored:${GITHUB_REF_NAME}" -f Dockerfile.goreleaser .

      - name: Push to GHCR
        run: |
          set -euo pipefail
          PODMAN="${PODMAN:-/home/ender/.nix-profile/bin/podman}"
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "GHCR_TOKEN not set — image built as localhost/muxcored:${GITHUB_REF_NAME}"
            exit 0
          fi
          echo "$GHCR_TOKEN" | "$PODMAN" login ghcr.io -u muxcore-media --password-stdin
          "$PODMAN" tag "localhost/muxcored:${GITHUB_REF_NAME}" "ghcr.io/muxcore-media/muxcored:${GITHUB_REF_NAME}"
          "$PODMAN" tag "localhost/muxcored:${GITHUB_REF_NAME}" "ghcr.io/muxcore-media/core:${GITHUB_REF_NAME}"
          "$PODMAN" push "ghcr.io/muxcore-media/muxcored:${GITHUB_REF_NAME}"
          "$PODMAN" push "ghcr.io/muxcore-media/core:${GITHUB_REF_NAME}"
          echo "published ghcr.io/muxcore-media/muxcored:${GITHUB_REF_NAME}"
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
