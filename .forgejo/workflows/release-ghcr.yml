# Publish muxcored to GHCR on version tags (origin path when desk lacks gh packages scope).
# Builds on the host runner (Forgejo module fetch) then packages via Dockerfile.goreleaser.
# Requires repo secret GHCR_TOKEN (PAT or gh token with write:packages) for push.
name: Release GHCR
on:
  push:
    tags:
      - "v*"

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GOPROXY: https://proxy.golang.org,direct

jobs:
  publish:
    runs-on: native
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"

      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"

      - name: Build muxcored binary
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build \
            -ldflags="-s -w -X github.com/Muxcore-Media/core/internal/version.Version=${TAG}" \
            -o muxcored ./cmd/muxcored

      - name: Build muxcored OCI image
        run: |
          set -euo pipefail
          podman build -t "localhost/muxcored:${GITHUB_REF_NAME}" -f Dockerfile.goreleaser .

      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "GHCR_TOKEN not set — image built as localhost/muxcored:${GITHUB_REF_NAME} only"
            exit 0
          fi
          echo "$GHCR_TOKEN" | podman login ghcr.io -u muxcore-media --password-stdin
          podman tag "localhost/muxcored:${GITHUB_REF_NAME}" "ghcr.io/muxcore-media/muxcored:${GITHUB_REF_NAME}"
          podman tag "localhost/muxcored:${GITHUB_REF_NAME}" "ghcr.io/muxcore-media/core:${GITHUB_REF_NAME}"
          podman push "ghcr.io/muxcore-media/muxcored:${GITHUB_REF_NAME}"
          podman push "ghcr.io/muxcore-media/core:${GITHUB_REF_NAME}"

      - name: BUILD_ONLY notice
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "${GHCR_TOKEN:-}" ]; then exit 0; fi
          echo "Add GHCR_TOKEN (write:packages) in Forgejo repo secrets to enable GHCR push"
