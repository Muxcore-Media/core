name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GOPROXY: https://proxy.golang.org,direct

jobs:
  test:
    runs-on: native
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          export PATH="$HOME/.local/go/bin:$PATH"
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
          go test -count=1 -timeout 120s ./internal/... ./pkg/...
          go test -count=1 -timeout 30s ./cmd/...

  build:
    runs-on: native
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
      - name: Build and vet
        run: |
          export PATH="$HOME/.local/go/bin:$PATH"
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
          go build -o /dev/null ./cmd/muxcored
          go vet ./internal/... ./pkg/... ./cmd/...
