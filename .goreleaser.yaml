# GoReleaser configuration for MuxCore
version: 2

project_name: muxcored

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: muxcored
    main: ./cmd/muxcored
    binary: muxcored
    ldflags:
      - -s -w
      - -X github.com/Muxcore-Media/core/internal/version.Version={{.Version}}
      - -X github.com/Muxcore-Media/core/internal/version.commit={{.Commit}}
      - -X github.com/Muxcore-Media/core/internal/version.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binary
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# GHCR image (lowercase owner required). Needs Docker on the runner + packages:write.
dockers:
  - id: muxcored-linux-amd64
    ids:
      - muxcored
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "ghcr.io/muxcore-media/muxcored:{{ .Version }}"
      - "ghcr.io/muxcore-media/muxcored:{{ .Tag }}"
      - "ghcr.io/muxcore-media/core:{{ .Version }}"
      - "ghcr.io/muxcore-media/core:{{ .Tag }}"
    skip_push: false

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  name_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Muxcore-Media
    name: core
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"

signs:
  # Requires COSIGN_PRIVATE_KEY (+ COSIGN_PASSWORD) in the Release job env.
  # Self-hosted runners may also rewrite a legacy --key=cosign.pub via wrapper.
  - cmd: cosign
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--yes"
      - "--tlog-upload=false"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: all

# One SBOM per archive — include Os/Arch so names stay unique.
# A shared "{{ .Version }}.spdx.json" caused duplicate artifacts and GitHub
# upload 404s on v0.5.0 (concurrent same-name POSTs).
sboms:
  - id: spdx
    artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.spdx.json"
