# MuxCore Environment Configuration
# Place in /etc/muxcore/muxcore.conf
# Restart muxcored after changes: systemctl restart muxcored

# HTTP server
# MUXCORE_ADDR=:8080
# MUXCORE_TLS_CERT=/etc/muxcore/cert.pem
# MUXCORE_TLS_KEY=/etc/muxcore/key.pem

# gRPC mesh
# MUXCORE_GRPC_TLS_CERT=/etc/muxcore/grpc-cert.pem
# MUXCORE_GRPC_TLS_KEY=/etc/muxcore/grpc-key.pem

# Audit logging
# MUXCORE_AUDIT_PATH=/var/log/muxcore/audit.jsonl

# Event WAL persistence
# MUXCORE_EVENT_JOURNAL_PATH=/var/lib/muxcore/events

# Logging
# MUXCORE_LOG_LEVEL=info
# MUXCORE_LOG_FORMAT=json

# Cluster
# MUXCORE_CLUSTER_JOIN_TOKEN=<strong-secret>
# MUXCORE_GRPC_SEED_NODES=node1:9090,node2:9090
