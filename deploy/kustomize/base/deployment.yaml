apiVersion: apps/v1
kind: Deployment
metadata:
  name: muxcore
  labels:
    app.kubernetes.io/name: muxcore
    app.kubernetes.io/component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: muxcore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muxcore
    spec:
      serviceAccountName: muxcore
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: muxcore
          image: ghcr.io/muxcore-media/muxcored:latest
          imagePullPolicy: IfNotPresent
          args:
            - --tag
            - default
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: MUXCORE_ADDR
              value: ":8080"
          envFrom:
            - configMapRef:
                name: muxcore-config
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: muxcore-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      restartPolicy: Always
