# MuxCore module environment configuration.
# Place in /etc/muxcore/modules/<module-id>/env
# Restart the module after changes: systemctl restart muxcore-module@<module-id>

# Required: core gRPC address
MUXCORE_GRPC_ADDR=127.0.0.1:9090

# Required: module identifier
MUXCORE_MODULE_ID=my-module

# Per-module configuration (prefix with MUXCORE_CFG_)
# MUXCORE_CFG_API_KEY=your-api-key
# MUXCORE_CFG_MAX_CONNECTIONS=10
