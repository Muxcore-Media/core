# Example docker-compose running core + a module as separate containers.
# The module connects to core via gRPC on the internal network.
#
# Usage:
#   docker compose -f docker-compose.example.yml up
#
# TODO: replace <module-image> with the module's image name.
services:
  core:
    image: ghcr.io/muxcore-media/muxcored:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MUXCORE_ADDR: ":8080"
    restart: unless-stopped

  my-module:
    # TODO: replace with the module's image
    image: <module-image>:latest
    environment:
      MUXCORE_GRPC_ADDR: "core:9090"
      MUXCORE_MODULE_ID: "my-module"
      # MUXCORE_CFG_API_KEY: "..."
    depends_on:
      - core
    restart: unless-stopped
