version: 3
workdir: .

vendors:
  grpc:
    in:
      - google.golang.org/grpc
      - google.golang.org/grpc/**

components:
  cmd:
    in: cmd/**

  internal:
    in: internal/**

  integsupport:
    in: integsupport/**

  pkg:
    in: pkg/**

  proto:
    in: proto/gen/**

  sdk:
    in: sdk/**

commonComponents:
  - proto

deps:
  cmd:
    mayDependOn:
      - internal
      - pkg
      - proto
    anyVendorDeps: true

  internal:
    anyProjectDeps: true
    anyVendorDeps: true

  integsupport:
    mayDependOn:
      - internal
    canUse:
      - grpc

  pkg:
    mayDependOn:
      - proto
    anyVendorDeps: true

  sdk:
    mayDependOn:
      - pkg
      - proto
    anyVendorDeps: true

  proto:
    anyProjectDeps: true
    anyVendorDeps: true

exclude:
  - "**/*_test.go"
  - "**/mock/**"
  - "**/integration/**"
  - "sdk/go/module/**"
