[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxcore-sdk"
version = "0.1.0"
description = "Python SDK for MuxCore sidecar modules (register / lifecycle)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Muxcore Media" }]
dependencies = [
  "grpcio>=1.62",
  "protobuf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools>=1.62"]

[tool.hatch.build.targets.wheel]
packages = ["src/muxcore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
