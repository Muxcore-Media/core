name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  verify:
    name: Go Mod Verify
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go mod verify
      - run: go mod tidy -diff

  lint:
    name: Lint & Static Analysis
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go vet ./internal/... ./pkg/... ./cmd/... ./sdk/...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./internal/... ./pkg/... ./cmd/... ./sdk/...
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run --timeout 120s ./internal/... ./pkg/... ./cmd/... ./sdk/...


  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go test -race -count=1 -timeout 120s ./internal/... ./pkg/...
      - run: go test -race -count=1 -timeout 30s ./cmd/...
      - name: Test SDK packages
        run: |
          (cd sdk/go/mock && go test -race -count=1 -timeout 60s ./...)
          (cd sdk/go/client && go mod tidy && go test -race -count=1 -timeout 60s ./...)
      - name: Integration tests
        run: go test -tags=integration -race -count=1 -timeout 120s ./internal/integration/...

  coverage:
    name: Coverage
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/... ./cmd/...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4 # v7.0.1
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go build -ldflags="-s -w -X github.com/Muxcore-Media/core/internal/version.Version=$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)" -o muxcored ./cmd/muxcored
      - name: Verify binary starts
        run: |
          MUXCORE_INSECURE_DISABLE_TLS=true ./muxcored --version
          echo "Binary smoke-test passed"

  provenance:
    name: SLSA Provenance
    runs-on: self-hosted
    needs: build
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build binary for provenance
        run: |
          go build -ldflags="-s -w" -o muxcored ./cmd/muxcored
      - name: Generate SLSA provenance
        run: |
          # Generate in-toto SLSA provenance attestation
          COMMIT_SHA=$(git rev-parse HEAD)
          BUILDER_ID="https://github.com/Muxcore-Media/core/.github/workflows/ci.yml@refs/heads/master"
          BINARY_SHA=$(sha256sum muxcored | cut -d' ' -f1)

          cat > provenance.json << PROVEOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "muxcored",
                "digest": {
                  "sha256": "${BINARY_SHA}"
                }
              }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/Muxcore-Media/core/.github/workflows/ci.yml",
                "externalParameters": {
                  "source": {
                    "uri": "https://github.com/Muxcore-Media/core",
                    "digest": {
                      "sha1": "${COMMIT_SHA}"
                    }
                  }
                },
                "internalParameters": {
                  "builderImage": "go:1.26.3",
                  "buildFlags": ["-ldflags=-s -w"]
                },
                "resolvedDependencies": []
              },
              "runDetails": {
                "builder": {
                  "id": "${BUILDER_ID}"
                },
                "metadata": {
                  "invocationId": "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                }
              }
            }
          }
          PROVEOF
      - name: Sign provenance with cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign attest-blob --key env://COSIGN_PRIVATE_KEY --predicate provenance.json --type slsaprovenance1 muxcored
          else
            echo "COSIGN_PRIVATE_KEY not set — skipping attestation"
          fi
      - name: Upload provenance
        uses: actions/upload-artifact@v4 # v7.0.1
        with:
          name: slsa-provenance
          path: provenance.json

  docker:
    name: Docker Build Test
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t muxcore:ci .

  vulncheck:
    name: Vulnerability Scan
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck -show verbose ./...
