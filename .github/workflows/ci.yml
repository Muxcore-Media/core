name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  verify:
    name: Go Mod Verify
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - run: go mod verify
      - run: go mod tidy -diff
      - name: Verify SDK submodules
        run: |
          (cd sdk/go/client && go mod verify && go mod tidy -diff)
          (cd sdk/go/mock && go mod verify && go mod tidy -diff)
      - name: Check for outdated dependencies
        continue-on-error: true
        run: |
          go install github.com/psampaz/go-mod-outdated@latest
          echo "::group::Main module outdated deps"
          go list -u -m -json all | go-mod-outdated --update-style || true
          echo "::endgroup::"
          echo "::group::SDK client outdated deps"
          (cd sdk/go/client && go list -u -m -json all | go-mod-outdated --update-style || true)
          echo "::endgroup::"
          echo "::group::SDK mock outdated deps"
          (cd sdk/go/mock && go list -u -m -json all | go-mod-outdated --update-style || true)
          echo "::endgroup::"

  lint:
    name: Lint & Static Analysis
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - run: go vet ./internal/... ./pkg/... ./cmd/... ./sdk/...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./internal/... ./pkg/... ./cmd/... ./sdk/...
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run --timeout 120s ./internal/... ./pkg/... ./cmd/... ./sdk/...
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest
      - run: go-arch-lint check
      - name: Protobuf breaking change check
        continue-on-error: true
        uses: bufbuild/buf-action@v1
        with:
          setup_only: false
          input: proto
          against: https://github.com/Muxcore-Media/core.git
          only_breaking: true


  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - run: go test -count=1 -timeout 120s ./internal/... ./pkg/...
      - run: go test -count=1 -timeout 30s ./cmd/...
      - name: Test SDK packages
        run: |
          (cd sdk/go/mock && go test -count=1 -timeout 60s ./...)
          (cd sdk/go/client && go mod tidy && go test -count=1 -timeout 60s ./...)
      - name: Integration tests
        run: go test -tags=integration -count=1 -timeout 120s ./internal/integration/...
      - name: Fuzz tests
        continue-on-error: true
        run: |
          go test -fuzz=FuzzConfigLoad -fuzztime=10s -parallel=1 ./internal/config/...
          go test -fuzz=FuzzConfigValidate -fuzztime=10s -parallel=1 ./internal/config/...
          go test -fuzz=FuzzSpoolURLValidation -fuzztime=10s -parallel=1 ./internal/spool/...
          go test -fuzz=FuzzSpoolTagName -fuzztime=10s -parallel=1 ./internal/spool/...
          go test -fuzz=FuzzEncodeKeyRoundTrip -fuzztime=10s -parallel=1 ./internal/storage/local/...
          go test -fuzz=FuzzDecodeKeyNoPanic -fuzztime=10s -parallel=1 ./internal/storage/local/...
          go test -fuzz=FuzzProtoStorageMessages -fuzztime=10s -parallel=1 ./internal/grpcmesh/...
          go test -fuzz=FuzzProtoHealthMessages -fuzztime=10s -parallel=1 ./internal/grpcmesh/...
          go test -fuzz=FuzzProtoEventsMessages -fuzztime=10s -parallel=1 ./internal/grpcmesh/...
          go test -fuzz=FuzzProtoDiscoveryMessages -fuzztime=10s -parallel=1 ./internal/grpcmesh/...
          go test -fuzz=FuzzProtoMeshMessages -fuzztime=10s -parallel=1 ./internal/grpcmesh/...
          go test -fuzz=FuzzProtoModuleRegistrationMessages -fuzztime=10s -parallel=1 ./internal/grpcmesh/...

  coverage:
    name: Coverage
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/... ./cmd/...
      - name: Check coverage threshold
        run: |
          go tool cover -func=coverage.out | awk '/^total:/ {
            pct = $3 + 0;
            if (pct < 60) {
              printf "FAIL: coverage %.1f%% is below threshold 60%%\n", pct;
              exit 1;
            }
            printf "OK: coverage %.1f%% meets threshold 60%%\n", pct;
          }'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - run: go build -ldflags="-s -w -X github.com/Muxcore-Media/core/internal/version.Version=$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)" -o muxcored ./cmd/muxcored
      - name: Verify binary starts
        run: |
          MUXCORE_DEV_TLS_SKIP=true ./muxcored --version
          echo "Binary smoke-test passed"

  provenance:
    name: SLSA Provenance
    runs-on: self-hosted
    needs: build
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build binary for provenance
        run: |
          go build -ldflags="-s -w" -o muxcored ./cmd/muxcored
      - name: Generate SLSA provenance
        run: |
          # cosign attest-blob --type slsaprovenance1 expects the predicate object
          # (buildDefinition/runDetails), not a full in-toto Statement.
          COMMIT_SHA=$(git rev-parse HEAD)
          BUILDER_ID="https://github.com/Muxcore-Media/core/.github/workflows/ci.yml@${GITHUB_REF}"
          BINARY_SHA=$(sha256sum muxcored | cut -d' ' -f1)
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg builder "$BUILDER_ID" \
            --arg inv "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{
              buildDefinition: {
                buildType: "https://github.com/Muxcore-Media/core/.github/workflows/ci.yml",
                externalParameters: {
                  source: {
                    uri: "https://github.com/Muxcore-Media/core",
                    digest: { sha1: $sha }
                  }
                },
                internalParameters: {
                  builderImage: "go:1.26.5",
                  buildFlags: ["-ldflags=-s -w"]
                },
                resolvedDependencies: []
              },
              runDetails: {
                builder: { id: $builder },
                metadata: { invocationId: $inv }
              }
            }' > provenance-predicate.json
          jq -n \
            --arg binsha "$BINARY_SHA" \
            --slurpfile pred provenance-predicate.json \
            '{
              "_type": "https://in-toto.io/Statement/v1",
              subject: [{ name: "muxcored", digest: { sha256: $binsha } }],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: $pred[0]
            }' > provenance.json
      - name: Sign provenance with cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign attest-blob --key env://COSIGN_PRIVATE_KEY --predicate provenance-predicate.json --type slsaprovenance1 muxcored
          else
            echo "COSIGN_PRIVATE_KEY not set — skipping attestation"
          fi
      - name: Upload provenance
        uses: actions/upload-artifact@v7 # v4.6.2
        with:
          name: slsa-provenance
          path: |
            provenance.json
            provenance-predicate.json

  docker:
    name: Docker Build Test
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - name: Build Docker image
        run: docker build -t muxcore:ci .

  vulncheck:
    name: Vulnerability Scan
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - name: Checkout
        uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        run: govulncheck -show verbose ./...
