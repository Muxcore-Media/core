name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  verify:
    name: Go Mod Verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go mod verify
      - run: go mod tidy -diff

  lint:
    name: Lint & Static Analysis
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go vet ./internal/... ./pkg/... ./cmd/...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./internal/... ./pkg/... ./cmd/...
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin v2.12.2
      - run: golangci-lint run --timeout 120s ./internal/... ./pkg/... ./cmd/... || true
        continue-on-error: true


  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go test -race -count=1 -timeout 120s ./internal/... ./pkg/...
      - run: go test -race -count=1 -tags default -timeout 30s ./cmd/...

  coverage:
    name: Coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/... ./cmd/...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  fuzz:
    name: Fuzz (Brief)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go test -fuzz=. -fuzztime=30s ./internal/... ./pkg/... || echo "fuzz found issues"

  build:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go build -ldflags="-s -w" -o muxcored ./cmd/muxcored
      - run: go build -tags default -ldflags="-s -w" -o muxcored-default ./cmd/muxcored

  docker:
    name: Docker Build Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t muxcore:ci .

  vulncheck:
    name: Vulnerability Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck -show verbose ./...

