syntax = "proto3";

package muxcore.secrets.v1;

option go_package = "github.com/Muxcore-Media/core/proto/gen/muxcore/secrets/v1;secretsv1";

// SecretsService is implemented by sidecar modules that provide secret storage.
// Core discovers these modules by the "secrets" capability and queries them
// when modules request credential retrieval.
service SecretsService {
  // Get retrieves a secret by key. Returns NOT_FOUND if the key does not exist.
  rpc Get(GetRequest) returns (GetResponse);

  // Set stores a secret value under the given key.
  rpc Set(SetRequest) returns (SetResponse);

  // Delete removes a secret by key. Returns OK even if the key does not exist.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // List returns all known secret key names (values are NOT included).
  rpc List(ListRequest) returns (ListResponse);
}

message GetRequest {
  // key is the secret identifier to retrieve.
  string key = 1;
}

message GetResponse {
  // key is the secret identifier.
  string key = 1;
  // value is the decrypted secret. Never logged.
  string value = 2;
}

message SetRequest {
  // key is the secret identifier.
  string key = 1;
  // value is the secret value to store.
  string value = 2;
}

message SetResponse {
  // status indicates success.
  string status = 1;
}

message DeleteRequest {
  // key is the secret identifier to remove.
  string key = 1;
}

message DeleteResponse {
  // status indicates success.
  string status = 1;
}

message ListRequest {}

message ListResponse {
  // keys is the list of secret key names (values not included).
  repeated string keys = 1;
  // count is the total number of stored secrets.
  int32 count = 2;
}
