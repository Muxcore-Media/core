syntax = "proto3";

package muxcore.auth.v1;

option go_package = "github.com/Muxcore-Media/core/proto/gen/muxcore/auth/v1;authv1";

// AuthService is implemented by sidecar modules that provide authentication,
// authorization, and identity extraction. Core discovers these modules by
// capability and delegates requests to them via gRPC.
service AuthService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  rpc Can(CanRequest) returns (CanResponse);
  rpc ExtractIdentity(ExtractIdentityRequest) returns (ExtractIdentityResponse);

  // TOTP two-factor authentication management.
  rpc EnableTOTP(EnableTOTPRequest) returns (EnableTOTPResponse);
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse);
  rpc TOTPStatus(TOTPStatusRequest) returns (TOTPStatusResponse);
  rpc VerifyTOTPSetup(VerifyTOTPSetupRequest) returns (VerifyTOTPSetupResponse);

  // User management (admin only).
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // DeleteUser starts a user erasure (ADR-0035 §1). It requires a current,
  // fully authenticated end-user session in x-auth-token whose user still has
  // the admin role, rechecked as in ADR-0026 §2; a verified mesh certificate
  // alone is insufficient (no mesh-peer bypass for this method). Missing,
  // expired or partial authentication returns Unauthenticated; a non-admin
  // returns PermissionDenied. The target must exist in the caller's verified
  // tenant (empty = the single household): an unknown or other-tenant id
  // returns NotFound. Deleting oneself, or the last user holding admin in the
  // tenant, returns FailedPrecondition; the admin count is taken inside the
  // delete transaction. One provider transaction revokes every credential and
  // session of the user and records a tombstone; DeleteUserResponse.erasure_id
  // identifies it. Repeating DeleteUser for a tombstoned id succeeds and
  // returns the same erasure_id. Providers that predate ADR-0035 leave
  // erasure_id empty.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  rpc SetRoles(SetRolesRequest) returns (SetRolesResponse);

  // API token management.
  rpc CreateAPIToken(CreateAPITokenRequest) returns (CreateAPITokenResponse);
  rpc ListAPITokens(ListAPITokensRequest) returns (ListAPITokensResponse);
  rpc DeleteAPIToken(DeleteAPITokenRequest) returns (DeleteAPITokenResponse);

  // WebAuthn credential management (admin).
  rpc ListWebAuthnCredentials(ListWebAuthnCredentialsRequest) returns (ListWebAuthnCredentialsResponse);
  rpc DeleteWebAuthnCredential(DeleteWebAuthnCredentialRequest) returns (DeleteWebAuthnCredentialResponse);
  rpc BeginAdminRegistration(BeginAdminRegistrationRequest) returns (BeginAdminRegistrationResponse);
  rpc CompleteAdminRegistration(CompleteAdminRegistrationRequest) returns (CompleteAdminRegistrationResponse);

  // Household invites. CreateInvite, ListInvites and RevokeInvite are admin
  // only (or a verified mesh caller); RedeemInvite is unauthenticated and is
  // gated by possession of the raw invite token.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc RedeemInvite(RedeemInviteRequest) returns (RedeemInviteResponse);

  // Administrative session management (FR-AUTH-007). Both methods require a
  // current, fully authenticated end-user session in x-auth-token whose user
  // still has the admin role. A verified mesh certificate alone is insufficient
  // and must not override a missing, expired, partial, or non-admin token.
  // Missing/invalid authentication returns Unauthenticated; a non-admin user
  // returns PermissionDenied. Providers without this feature return Unimplemented.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // User erasure ledger (ADR-0035 §2, NFR-DATA-003). The ledger of erasure
  // tombstones is the only authority for erasing a user's data in other
  // modules; no event, header or payload is. Providers without the ledger
  // return Unimplemented for all three methods.
  //
  // ListUserErasures and AckUserErasure admit only a caller presenting a
  // verified mesh client certificate whose CN is on the provider allowlist
  // (AUTH_ERASURE_CONSUMERS, ADR-0020 pattern). A user bearer, admin or not,
  // is rejected and never substitutes for the certificate. A missing or
  // unverified certificate returns Unauthenticated; a CN that is not
  // allowlisted returns PermissionDenied. The acknowledging module is the
  // verified CN, never a request field. In the dev profile without
  // certificates the provider may trust x-caller-id (ADR-0017 §2); dev has no
  // household acceptance.
  rpc ListUserErasures(ListUserErasuresRequest) returns (ListUserErasuresResponse);
  rpc AckUserErasure(AckUserErasureRequest) returns (AckUserErasureResponse);
  // GetUserErasureStatus reports per-module completion for administrators. It
  // requires a current, fully authenticated end-user admin session in
  // x-auth-token, rechecked as in ADR-0026 §2 (Unauthenticated /
  // PermissionDenied); a verified mesh certificate alone is insufficient. It
  // reports only erasures in the caller's verified tenant.
  rpc GetUserErasureStatus(GetUserErasureStatusRequest) returns (GetUserErasureStatusResponse);
}

message AuthenticateRequest {
  string credential_type = 1;
  bytes credential_data = 2;
}

message AuthenticateResponse {
  bool authenticated = 1;
  string session_token = 2;
  string partial_token = 3;
  bool requires_2fa = 4;
  repeated string available_methods = 5;
  string user_id = 6;
  string username = 7;
  repeated string roles = 8;
  repeated string permissions = 9;
  string error = 10;
  string tenant_id = 11;
}

message ValidateRequest {
  string token = 1;
}

message ValidateResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  string error = 6;
  string tenant_id = 7;
}

message RevokeRequest {
  string token = 1;
}

message RevokeResponse {}

message CanRequest {
  string user_id = 1;
  string action = 2;
  string resource = 3;
}

message CanResponse {
  bool allowed = 1;
  string reason = 2;
}

message ExtractIdentityRequest {
  string token = 1;
  string caller_id = 2;
}

message ExtractIdentityResponse {
  bool found = 1;
  string id = 2;
  string kind = 3;
  repeated string roles = 4;
  string error = 5;
  string tenant_id = 6;
}

message EnableTOTPRequest {
  string user_id = 1;
}

message EnableTOTPResponse {
  string secret = 1;        // base32-encoded TOTP secret
  string qr_code_url = 2;   // otpauth:// URL for QR code
  string error = 3;
}

message DisableTOTPRequest {
  string user_id = 1;
}

message DisableTOTPResponse {
  string error = 1;
}

message TOTPStatusRequest {
  string user_id = 1;
}

message TOTPStatusResponse {
  bool enabled = 1;
  string verified_at = 2;
}

message VerifyTOTPSetupRequest {
  string user_id = 1;
  string totp_code = 2;
}

message VerifyTOTPSetupResponse {
  bool verified = 1;
  string error = 2;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
}

message CreateUserResponse {
  string user_id = 1;
  string error = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  string error = 1;
  // Opaque, random identifier of the erasure tombstone (ADR-0035 §1). Never
  // derived from the user id or username. Empty from providers that predate
  // ADR-0035 and whenever error is set.
  string erasure_id = 2;
}

message ListUsersRequest {}

message UserInfo {
  string id = 1;
  string username = 2;
  repeated string roles = 3;
  bool totp_enabled = 4;
  string tenant_id = 5;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message SetPasswordRequest {
  string user_id = 1;
  string password = 2;
}

message SetPasswordResponse {
  string error = 1;
}

message SetRolesRequest {
  string user_id = 1;
  repeated string roles = 2;
}

message SetRolesResponse {
  string error = 1;
}

message CreateAPITokenRequest {
  string user_id = 1;
  string name = 2;
  repeated string scopes = 3;
}

message APITokenInfo {
  string id = 1;
  string name = 2;
  string prefix = 3;
  repeated string scopes = 4;
  string created_at = 5;
}

message CreateAPITokenResponse {
  string token = 1;      // full raw token — only returned on creation
  string token_id = 2;
  string error = 3;
}

message ListAPITokensRequest {
  string user_id = 1;
}

message ListAPITokensResponse {
  repeated APITokenInfo tokens = 1;
}

message DeleteAPITokenRequest {
  string token_id = 1;
}

message DeleteAPITokenResponse {
  string error = 1;
}

// --- WebAuthn credential management ---

message WebAuthnCredentialInfo {
  string id = 1;
  string credential_type = 2;
  string transports = 3;
  string aaguid = 4;
  string created_at = 5;
  string last_used_at = 6;
}

message ListWebAuthnCredentialsRequest {
  string session_token = 1;
  string user_id = 2;
}

message ListWebAuthnCredentialsResponse {
  repeated WebAuthnCredentialInfo credentials = 1;
  string error = 2;
}

message DeleteWebAuthnCredentialRequest {
  string session_token = 1;
  string user_id = 2;
  string credential_id = 3;
}

message DeleteWebAuthnCredentialResponse {
  string error = 1;
}

message BeginAdminRegistrationRequest {
  string session_token = 1;
  string user_id = 2;
}

message BeginAdminRegistrationResponse {
  bytes options_json = 1;     // JSON WebAuthn creation options
  string challenge = 2;       // extracted challenge for session lookup
  string error = 3;
}

message CompleteAdminRegistrationRequest {
  string session_token = 1;
  string user_id = 2;
  string challenge = 3;
  bytes credential_response_json = 4;  // JSON from navigator.credentials.create()
}

message CompleteAdminRegistrationResponse {
  string error = 1;
}

// --- Household invites ---

// InviteInfo describes an invite without its secret token.
message InviteInfo {
  string id = 1;
  string prefix = 2;       // non-secret token prefix, for display
  string created_by = 3;
  string role = 4;         // role granted to the redeemed account
  string tenant_id = 5;
  int32 max_uses = 6;      // 0 = unlimited
  int32 use_count = 7;
  string expires_at = 8;   // RFC 3339
  string created_at = 9;   // RFC 3339
  string revoked_at = 10;  // RFC 3339; empty if not revoked
}

message CreateInviteRequest {
  string role = 1;
  string tenant_id = 2;
  int32 max_uses = 3;      // 0 = default (single use); negative = unlimited
  int64 ttl_seconds = 4;   // 0 = server default
}

message CreateInviteResponse {
  string invite_id = 1;
  string token = 2;        // full raw token — only returned on creation
  string prefix = 3;
  string error = 4;
}

message ListInvitesRequest {}

message ListInvitesResponse {
  repeated InviteInfo invites = 1;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message RevokeInviteResponse {
  string error = 1;
}

message RedeemInviteRequest {
  string token = 1;
  string username = 2;
  string password = 3;
}

message RedeemInviteResponse {
  string user_id = 1;
  string username = 2;
  repeated string roles = 3;
  string tenant_id = 4;
  string error = 5;
}

message ListSessionsRequest {
  // Empty lists active sessions for all users managed by this provider.
  string user_id = 1;
  // 0 selects 100. Values below 0 or above 500 return InvalidArgument.
  int32 page_size = 2;
  // Opaque continuation from a previous response. It is bound to user_id;
  // malformed tokens or a different user filter return InvalidArgument.
  string page_token = 3;
}

// A management view of an active session, never an authentication credential.
message SessionInfo {
  // Stable, independently generated opaque ID. Never a bearer token, its hash,
  // or any value accepted by Authenticate, Validate, or ExtractIdentity.
  string session_id = 1;
  string user_id = 2;
  string username = 3;
  // Fully authenticated session kind: "full" or "api-token".
  string kind = 4;
  string created_at = 5; // UTC RFC 3339.
  string expires_at = 6; // UTC RFC 3339.
}

message ListSessionsResponse {
  // Excludes expired, revoked, and partial (not fully authenticated) sessions.
  // Ordered by created_at ascending, then session_id ascending. Each page is
  // evaluated against current state; pagination does not preserve a snapshot.
  repeated SessionInfo sessions = 1;
  // Empty at the end. Continuation is exclusive of the last returned session,
  // including if that session expires or is revoked before the next request.
  // Must not contain a bearer token or its hash.
  string next_page_token = 2;
}

message RevokeSessionRequest {
  // Both fields are required; empty values return InvalidArgument. The provider
  // revokes only the exact (user_id, session_id) pair, atomically. An unknown or
  // already revoked pair succeeds without affecting another user's session.
  string user_id = 1;
  string session_id = 2;
}

// Successful revocation invalidates the associated bearer on the next provider
// validation. Apps with local session cookies must revalidate that bearer to
// enforce revocation. This does not revoke an API key that minted a session.
message RevokeSessionResponse {}

// --- User erasure ledger (ADR-0035) ---

// Outcome of one module's application of an erasure tombstone.
enum ErasureOutcome {
  // Not acknowledged yet (status only). Rejected by AckUserErasure.
  ERASURE_OUTCOME_UNSPECIFIED = 0;
  // The module applied the tombstone and its post-condition holds.
  ERASURE_OUTCOME_OK = 1;
  // Application or its post-condition failed; the module retries.
  ERASURE_OUTCOME_FAILED = 2;
  // The module cannot apply erasures. Never counts as complete.
  ERASURE_OUTCOME_UNSUPPORTED = 3;
}

message ListUserErasuresRequest {
  // Opaque continuation from a previous response; empty starts at the
  // beginning. Malformed tokens return InvalidArgument.
  string page_token = 1;
  // 0 selects 100. Values below 0 or above 500 return InvalidArgument.
  int32 page_size = 2;
}

// An erasure tombstone. It carries no username or other profile data.
message UserErasure {
  // Random, opaque and unique; never reused.
  string erasure_id = 1;
  // The erased user's id (globally unique and never reused by the provider).
  // Owners erase by this id, never by username.
  string user_id = 2;
  // The user's tenant; empty means the single household.
  string tenant_id = 3;
  // UTC RFC 3339.
  string deleted_at = 4;
  // True when the calling module's (verified CN's) most recent
  // acknowledgement of this erasure has outcome OK. It is a hint for skipping
  // a redundant acknowledgement only: a consumer applies every tombstone that
  // is missing from its own local record regardless of this flag (restores).
  bool acknowledged_by_caller = 5;
}

message ListUserErasuresResponse {
  // The whole ledger, every tenant, ordered by deleted_at ascending then
  // erasure_id ascending. Tombstones are never pruned. Continuation is
  // exclusive of the last returned tombstone.
  repeated UserErasure erasures = 1;
  // Empty at the end.
  string next_page_token = 2;
}

message AckUserErasureRequest {
  // Required. An unknown erasure_id returns NotFound.
  string erasure_id = 1;
  // Required; UNSPECIFIED returns InvalidArgument.
  ErasureOutcome outcome = 2;
  // Short machine-readable reason, e.g. "apply_failed": at most 64 characters
  // from [a-z0-9_.-]. Never a user id, username or other personal data.
  // Anything else returns InvalidArgument.
  string detail_code = 3;
  // Optional per-store counts of rows deleted or anonymised, e.g.
  // {"user_blobs": 3}. Keys follow the detail_code rules; at most 32 entries;
  // negative values return InvalidArgument.
  map<string, int64> counts = 4;
  // There is deliberately no module field: the acknowledging module is the
  // caller's verified certificate CN.
}

// Acknowledgement is idempotent. The most recent acknowledgement per
// (erasure_id, acknowledging module) is authoritative.
message AckUserErasureResponse {}

message GetUserErasureStatusRequest {
  // When set, report only this erasure (NotFound if unknown in the caller's
  // tenant) and ignore pending_only and paging.
  string erasure_id = 1;
  // When erasure_id is empty: true reports only erasures that are not yet
  // complete; false reports all.
  bool pending_only = 2;
  // 0 selects 100. Values below 0 or above 500 return InvalidArgument.
  int32 page_size = 3;
  // Opaque continuation, bound to pending_only. Malformed tokens return
  // InvalidArgument.
  string page_token = 4;
}

message ErasureModuleStatus {
  // The acknowledging module's verified CN, or a required module that has not
  // acknowledged yet.
  string module_id = 1;
  // UNSPECIFIED: a required module has not acknowledged yet (pending).
  ErasureOutcome outcome = 2;
  string detail_code = 3;
  // UTC RFC 3339 time of the most recent acknowledgement; empty when pending.
  string acked_at = 4;
  // True when the module is listed in AUTH_ERASURE_REQUIRED.
  bool required = 5;
}

message ErasureStatus {
  string erasure_id = 1;
  // UTC RFC 3339.
  string deleted_at = 2;
  // Every required module, plus any other module that acknowledged.
  repeated ErasureModuleStatus modules = 3;
  // True when every module in AUTH_ERASURE_REQUIRED has acknowledged OK.
  bool complete = 4;
}

message GetUserErasureStatusResponse {
  // Ordered by deleted_at ascending then erasure_id ascending.
  repeated ErasureStatus erasures = 1;
  // Empty at the end.
  string next_page_token = 2;
}
