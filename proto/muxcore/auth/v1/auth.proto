syntax = "proto3";

package muxcore.auth.v1;

option go_package = "github.com/Muxcore-Media/core/proto/gen/muxcore/auth/v1;authv1";

// AuthService is implemented by sidecar modules that provide authentication,
// authorization, and identity extraction. Core discovers these modules by
// capability and delegates requests to them via gRPC.
service AuthService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  rpc Can(CanRequest) returns (CanResponse);
  rpc ExtractIdentity(ExtractIdentityRequest) returns (ExtractIdentityResponse);

  // TOTP two-factor authentication management.
  rpc EnableTOTP(EnableTOTPRequest) returns (EnableTOTPResponse);
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse);
  rpc TOTPStatus(TOTPStatusRequest) returns (TOTPStatusResponse);
  rpc VerifyTOTPSetup(VerifyTOTPSetupRequest) returns (VerifyTOTPSetupResponse);

  // User management (admin only).
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  rpc SetRoles(SetRolesRequest) returns (SetRolesResponse);

  // API token management.
  rpc CreateAPIToken(CreateAPITokenRequest) returns (CreateAPITokenResponse);
  rpc ListAPITokens(ListAPITokensRequest) returns (ListAPITokensResponse);
  rpc DeleteAPIToken(DeleteAPITokenRequest) returns (DeleteAPITokenResponse);

  // WebAuthn credential management (admin).
  rpc ListWebAuthnCredentials(ListWebAuthnCredentialsRequest) returns (ListWebAuthnCredentialsResponse);
  rpc DeleteWebAuthnCredential(DeleteWebAuthnCredentialRequest) returns (DeleteWebAuthnCredentialResponse);
  rpc BeginAdminRegistration(BeginAdminRegistrationRequest) returns (BeginAdminRegistrationResponse);
  rpc CompleteAdminRegistration(CompleteAdminRegistrationRequest) returns (CompleteAdminRegistrationResponse);

  // Household invites. CreateInvite, ListInvites and RevokeInvite are admin
  // only (or a verified mesh caller); RedeemInvite is unauthenticated and is
  // gated by possession of the raw invite token.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc RedeemInvite(RedeemInviteRequest) returns (RedeemInviteResponse);

  // Administrative session management (FR-AUTH-007). Both methods require a
  // current, fully authenticated end-user session in x-auth-token whose user
  // still has the admin role. A verified mesh certificate alone is insufficient
  // and must not override a missing, expired, partial, or non-admin token.
  // Missing/invalid authentication returns Unauthenticated; a non-admin user
  // returns PermissionDenied. Providers without this feature return Unimplemented.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
}

message AuthenticateRequest {
  string credential_type = 1;
  bytes credential_data = 2;
}

message AuthenticateResponse {
  bool authenticated = 1;
  string session_token = 2;
  string partial_token = 3;
  bool requires_2fa = 4;
  repeated string available_methods = 5;
  string user_id = 6;
  string username = 7;
  repeated string roles = 8;
  repeated string permissions = 9;
  string error = 10;
  string tenant_id = 11;
}

message ValidateRequest {
  string token = 1;
}

message ValidateResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  string error = 6;
  string tenant_id = 7;
}

message RevokeRequest {
  string token = 1;
}

message RevokeResponse {}

message CanRequest {
  string user_id = 1;
  string action = 2;
  string resource = 3;
}

message CanResponse {
  bool allowed = 1;
  string reason = 2;
}

message ExtractIdentityRequest {
  string token = 1;
  string caller_id = 2;
}

message ExtractIdentityResponse {
  bool found = 1;
  string id = 2;
  string kind = 3;
  repeated string roles = 4;
  string error = 5;
  string tenant_id = 6;
}

message EnableTOTPRequest {
  string user_id = 1;
}

message EnableTOTPResponse {
  string secret = 1;        // base32-encoded TOTP secret
  string qr_code_url = 2;   // otpauth:// URL for QR code
  string error = 3;
}

message DisableTOTPRequest {
  string user_id = 1;
}

message DisableTOTPResponse {
  string error = 1;
}

message TOTPStatusRequest {
  string user_id = 1;
}

message TOTPStatusResponse {
  bool enabled = 1;
  string verified_at = 2;
}

message VerifyTOTPSetupRequest {
  string user_id = 1;
  string totp_code = 2;
}

message VerifyTOTPSetupResponse {
  bool verified = 1;
  string error = 2;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
}

message CreateUserResponse {
  string user_id = 1;
  string error = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  string error = 1;
}

message ListUsersRequest {}

message UserInfo {
  string id = 1;
  string username = 2;
  repeated string roles = 3;
  bool totp_enabled = 4;
  string tenant_id = 5;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message SetPasswordRequest {
  string user_id = 1;
  string password = 2;
}

message SetPasswordResponse {
  string error = 1;
}

message SetRolesRequest {
  string user_id = 1;
  repeated string roles = 2;
}

message SetRolesResponse {
  string error = 1;
}

message CreateAPITokenRequest {
  string user_id = 1;
  string name = 2;
  repeated string scopes = 3;
}

message APITokenInfo {
  string id = 1;
  string name = 2;
  string prefix = 3;
  repeated string scopes = 4;
  string created_at = 5;
}

message CreateAPITokenResponse {
  string token = 1;      // full raw token — only returned on creation
  string token_id = 2;
  string error = 3;
}

message ListAPITokensRequest {
  string user_id = 1;
}

message ListAPITokensResponse {
  repeated APITokenInfo tokens = 1;
}

message DeleteAPITokenRequest {
  string token_id = 1;
}

message DeleteAPITokenResponse {
  string error = 1;
}

// --- WebAuthn credential management ---

message WebAuthnCredentialInfo {
  string id = 1;
  string credential_type = 2;
  string transports = 3;
  string aaguid = 4;
  string created_at = 5;
  string last_used_at = 6;
}

message ListWebAuthnCredentialsRequest {
  string session_token = 1;
  string user_id = 2;
}

message ListWebAuthnCredentialsResponse {
  repeated WebAuthnCredentialInfo credentials = 1;
  string error = 2;
}

message DeleteWebAuthnCredentialRequest {
  string session_token = 1;
  string user_id = 2;
  string credential_id = 3;
}

message DeleteWebAuthnCredentialResponse {
  string error = 1;
}

message BeginAdminRegistrationRequest {
  string session_token = 1;
  string user_id = 2;
}

message BeginAdminRegistrationResponse {
  bytes options_json = 1;     // JSON WebAuthn creation options
  string challenge = 2;       // extracted challenge for session lookup
  string error = 3;
}

message CompleteAdminRegistrationRequest {
  string session_token = 1;
  string user_id = 2;
  string challenge = 3;
  bytes credential_response_json = 4;  // JSON from navigator.credentials.create()
}

message CompleteAdminRegistrationResponse {
  string error = 1;
}

// --- Household invites ---

// InviteInfo describes an invite without its secret token.
message InviteInfo {
  string id = 1;
  string prefix = 2;       // non-secret token prefix, for display
  string created_by = 3;
  string role = 4;         // role granted to the redeemed account
  string tenant_id = 5;
  int32 max_uses = 6;      // 0 = unlimited
  int32 use_count = 7;
  string expires_at = 8;   // RFC 3339
  string created_at = 9;   // RFC 3339
  string revoked_at = 10;  // RFC 3339; empty if not revoked
}

message CreateInviteRequest {
  string role = 1;
  string tenant_id = 2;
  int32 max_uses = 3;      // 0 = default (single use); negative = unlimited
  int64 ttl_seconds = 4;   // 0 = server default
}

message CreateInviteResponse {
  string invite_id = 1;
  string token = 2;        // full raw token — only returned on creation
  string prefix = 3;
  string error = 4;
}

message ListInvitesRequest {}

message ListInvitesResponse {
  repeated InviteInfo invites = 1;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message RevokeInviteResponse {
  string error = 1;
}

message RedeemInviteRequest {
  string token = 1;
  string username = 2;
  string password = 3;
}

message RedeemInviteResponse {
  string user_id = 1;
  string username = 2;
  repeated string roles = 3;
  string tenant_id = 4;
  string error = 5;
}

message ListSessionsRequest {
  // Empty lists active sessions for all users managed by this provider.
  string user_id = 1;
  // 0 selects 100. Values below 0 or above 500 return InvalidArgument.
  int32 page_size = 2;
  // Opaque continuation from a previous response. It is bound to user_id;
  // malformed tokens or a different user filter return InvalidArgument.
  string page_token = 3;
}

// A management view of an active session, never an authentication credential.
message SessionInfo {
  // Stable, independently generated opaque ID. Never a bearer token, its hash,
  // or any value accepted by Authenticate, Validate, or ExtractIdentity.
  string session_id = 1;
  string user_id = 2;
  string username = 3;
  // Fully authenticated session kind: "full" or "api-token".
  string kind = 4;
  string created_at = 5; // UTC RFC 3339.
  string expires_at = 6; // UTC RFC 3339.
}

message ListSessionsResponse {
  // Excludes expired, revoked, and partial (not fully authenticated) sessions.
  // Ordered by created_at ascending, then session_id ascending. Each page is
  // evaluated against current state; pagination does not preserve a snapshot.
  repeated SessionInfo sessions = 1;
  // Empty at the end. Continuation is exclusive of the last returned session,
  // including if that session expires or is revoked before the next request.
  // Must not contain a bearer token or its hash.
  string next_page_token = 2;
}

message RevokeSessionRequest {
  // Both fields are required; empty values return InvalidArgument. The provider
  // revokes only the exact (user_id, session_id) pair, atomically. An unknown or
  // already revoked pair succeeds without affecting another user's session.
  string user_id = 1;
  string session_id = 2;
}

// Successful revocation invalidates the associated bearer on the next provider
// validation. Apps with local session cookies must revalidate that bearer to
// enforce revocation. This does not revoke an API key that minted a session.
message RevokeSessionResponse {}
