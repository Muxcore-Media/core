syntax = "proto3";

package muxcore.module.v1;

option go_package = "github.com/Muxcore-Media/core/proto/gen/muxcore/module/v1;modulev1";

// ModuleRegistration is the service that sidecar module binaries call
// to register themselves with the core at startup and unregister at shutdown.
service ModuleRegistration {
  // Register is called by a sidecar module binary to register itself with core.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Unregister is called by a sidecar module binary at shutdown.
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);

  // BootstrapRegister is called by external modules (not spawned by core)
  // to obtain a signed client certificate using a one-time bootstrap token.
  // The module presents its token and a CSR; core validates the token and
  // returns a signed certificate. The module then reconnects with mTLS.
  rpc BootstrapRegister(BootstrapRegisterRequest) returns (BootstrapRegisterResponse);
}

// BootstrapRegisterRequest is sent by an external module to obtain a
// signed client certificate using a one-time bootstrap token.
message BootstrapRegisterRequest {
  // token is the one-time bootstrap token (mct_<version>_<module>_<hex>).
  string token = 1;
  // module_id the module claims as its identity.
  string module_id = 2;
  // csr_pem is a PEM-encoded PKCS#10 certificate signing request for a key
  // the module generated and keeps (ADR-0017). When set, core signs it and
  // returns no private key. When empty, core generates the key in memory and
  // returns it in key_pem (legacy path).
  string csr_pem = 3;
  // dns_names are extra DNS SANs the module asks for (for example its compose
  // service name). Core keeps only names allowed by MUXCORE_ENROLL_SAN_ALLOW;
  // the module ID and loopback are always included.
  repeated string dns_names = 4;
}

// BootstrapRegisterResponse returns the signed certificate and key on success.
message BootstrapRegisterResponse {
  // accepted indicates whether the certificate was issued.
  bool accepted = 1;
  // error contains a human-readable error message if not accepted.
  string error = 2;
  // signed_cert is the PEM-encoded certificate chain, leaf first (the core
  // CA is the root and is returned separately in ca_cert).
  string signed_cert = 3;
  // key_pem is the PEM-encoded private key for the certificate. Empty when
  // the request carried csr_pem: the module keeps its own key.
  string key_pem = 4;
  // ca_cert is the PEM-encoded CA certificate (for client to verify server).
  string ca_cert = 5;
}

// RegisterRequest is sent by a sidecar module binary to register itself.
message RegisterRequest {
  // module_id uniquely identifies the module.
  string module_id = 1;
  // (field number 2 was previously used for the deprecated info_json field)
  // mesh_addr is the module's own gRPC listen address for lifecycle calls.
  string mesh_addr = 3;
  // min_core_version is the minimum core version required by this module (SemVer).
  // Empty means compatible with any version. Core rejects incompatible modules.
  string min_core_version = 4;
  // module_info is the structured module metadata.
  ModuleInfo module_info = 5;
}

// ModuleInfo describes a module's identity and capabilities during registration.
message ModuleInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  repeated string roles = 4;
  string description = 5;
  string author = 6;
  repeated string capabilities = 7;
  repeated string depends_on = 8;
  string min_core_version = 9;
  string http_addr = 10;
}

// RegisterResponse is returned after a registration attempt.
message RegisterResponse {
  // accepted indicates whether the registration was accepted.
  bool accepted = 1;
  // error contains a human-readable error message if not accepted.
  string error = 2;
  // mesh_addr is the gRPC address where the sidecar can dial core's services
  // (RegistryService, StorageService, EventService, ModuleMesh).
  // The sidecar uses this to discover other modules and access storage.
  string mesh_addr = 3;
  // node_id is the core node's identifier.
  string node_id = 4;
}

// UnregisterRequest is sent by a sidecar module binary at shutdown.
message UnregisterRequest {
  // module_id uniquely identifies the module to unregister.
  string module_id = 1;
}

// UnregisterResponse confirms the unregistration.
message UnregisterResponse {
  // acknowledged indicates whether the unregistration was acknowledged.
  bool acknowledged = 1;
}
