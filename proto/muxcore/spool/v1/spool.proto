syntax = "proto3";

package muxcore.spool.v1;

option go_package = "github.com/Muxcore-Media/core/proto/gen/muxcore/spool/v1;spoolv1";

// SpoolService provides runtime management of spool configurations and
// tag-based module deployment. Admin tools and modules use this to
// discover available spools, inspect tags, and trigger deployments.
service SpoolService {
  // ListSpools returns the currently configured spool URLs.
  rpc ListSpools(ListSpoolsRequest) returns (ListSpoolsResponse);

  // ListTags returns all available tag names on the given spool.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // FetchTag fetches and returns a tag definition from a spool without
  // deploying its modules. Use DeployTag to actually spawn modules.
  rpc FetchTag(FetchTagRequest) returns (FetchTagResponse);

  // DeployTag fetches a tag, resolves all its modules, verifies checksums,
  // and spawns any that are not already running. Idempotent — modules
  // already running are skipped.
  rpc DeployTag(DeployTagRequest) returns (DeployTagResponse);
}

message ListSpoolsRequest {}

message SpoolInfo {
  // url is the spool base URL (e.g. "https://github.com/Muxcore-Media/spool").
  string url = 1;
  // active indicates this spool was used at startup (--spool flag).
  bool active = 2;
  // allowed_hosts lists the SSRF-protection host allow-list, if configured.
  repeated string allowed_hosts = 3;
}

message ListSpoolsResponse {
  repeated SpoolInfo spools = 1;
}

message ListTagsRequest {
  // spool_url overrides the default spool. Empty uses the boot-time spool.
  string spool_url = 1;
}

message TagSummary {
  string name = 1;
  string description = 2;
  string version = 3;
  int32 module_count = 4;
}

message ListTagsResponse {
  string spool_url = 1;
  repeated TagSummary tags = 2;
}

message FetchTagRequest {
  // spool_url overrides the default spool. Empty uses the boot-time spool.
  string spool_url = 1;
  // tag_name is the tag to fetch (e.g. "default").
  string tag_name = 2;
}

message TagModuleProto {
  string repo = 1;
  string version = 2;
  bool required = 3;
  string checksum = 4;
  string instance_id = 5;
  map<string, string> config = 6;
  // signature is an optional ed25519 detached signature (hex/base64) over the
  // module artifact. Sidecar .sig / .minisig files are also accepted.
  string signature = 7;
  // publisher is an optional publisher identity for marketplace trust allowlists.
  string publisher = 8;
}

message FetchTagResponse {
  string name = 1;
  string description = 2;
  string version = 3;
  repeated TagModuleProto modules = 4;
  string spool_url = 5;
}

message DeployTagRequest {
  // spool_url overrides the default spool. Empty uses the boot-time spool.
  string spool_url = 1;
  // tag_name is the tag to deploy (e.g. "default").
  string tag_name = 2;
}

message ModuleDeployResult {
  string module_id = 1;
  bool spawned = 2;
  bool already_running = 3;
  string error = 4;
}

message DeployTagResponse {
  string tag_name = 1;
  string spool_url = 2;
  repeated ModuleDeployResult results = 3;
  int32 total = 4;
  int32 spawned = 5;
  int32 skipped = 6;
  int32 failed = 7;
}
